<svg viewBox="0 0 512 511.99998518" xmlns="http://www.w3.org/2000/svg">

<style>
	.cutter-circle {
		transform-box: fill-box;
		transform-origin: center;
		animation: cutter-bob 2.8s ease-in-out infinite;
	}

	@keyframes cutter-bob {
		0%, 18% {
			transform: translateY(0);
		}

		45%, 62% {
			transform: translateY(64px);
		}

		82% {
			transform: translateY(0);
		}

		100% {
			transform: translateY(0);
		}
	}
</style>

